name: Sync Upstream (Preserve Fork Features)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'awesomeroy-cloud/gemini-app2api'
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch upstream and check for updates
        id: fetch
        run: |
          git remote add upstream https://github.com/ShawTim/gemini-app2api.git
          git fetch upstream main
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Upstream commits ahead: $AHEAD"

      - name: Merge upstream without losing fork features
        id: merge
        if: steps.fetch.outputs.ahead != '0'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 1
          fi

      - name: Verify fork features and release checks
        id: verify
        if: steps.fetch.outputs.ahead != '0' && steps.merge.outcome == 'success'
        continue-on-error: true
        run: |
          node --test \
            test/gateway-audit-store.test.mjs \
            test/i18n-zh-cn.test.mjs \
            test/admin-v2-static.test.mjs \
            test/gateway-http.test.mjs \
            test/gateway-startup.test.mjs \
            test/gateway-release-files.test.mjs
          node scripts/check-release.mjs

      - name: Push merged main
        if: steps.fetch.outputs.ahead != '0' && steps.merge.outcome == 'success' && steps.verify.outcome == 'success'
        run: git push origin main

      - name: Open issue on merge conflict or test failure
        if: steps.fetch.outputs.ahead != '0' && (steps.merge.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          UPSTREAM_SHA=$(git rev-parse --short upstream/main)
          TITLE="Upstream sync blocked at ${UPSTREAM_SHA}"
          BODY="Automated merge of \`ShawTim/gemini-app2api@main\` (\`${UPSTREAM_SHA}\`) did not push to protect fork features (audit log, zh-CN i18n, 8-char password).\n\n- Merge outcome: \`${MERGE_OUTCOME}\`\n- Verify outcome: \`${VERIFY_OUTCOME}\`\n- Conflicting files: \`${CONFLICTS:-none}\`\n\nRun \`git fetch upstream main && git merge upstream/main\` locally, resolve conflicts, verify tests, and push."
          gh issue create --title "$TITLE" --body "$(printf '%b' "$BODY")" || true
          exit 1
